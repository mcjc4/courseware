<script>


(function(){


  var PI = Math.PI;


  var stepIdx = 0;





  function renderTex(id, tex, display) {


    var el = document.getElementById(id);


    if (el) {


      katex.render(tex, el, { displayMode: !!display, throwOnError: false });


    }


  }





  renderTex('f1', 'f(x)=2\\cos\\left(2x+\\dfrac{\\pi}{6}\\right)');


  renderTex('interval', '[0,\\ a]');


  renderTex('range', '[-2,\\ \\sqrt{3}]');


  renderTex('avar', 'a');


  renderTex('albl', 'a =');





  var opts = [


    { label: 'A', tex: '\\left[\\dfrac{5\\pi}{12},\\ \\dfrac{5\\pi}{6}\\right]', correct: true },


    { label: 'B', tex: '\\left[\\dfrac{5\\pi}{12},\\ \\dfrac{11\\pi}{12}\\right]', correct: false },


    { label: 'C', tex: '\\left[\\dfrac{2\\pi}{5},\\ \\dfrac{5\\pi}{12}\\right]', correct: false },


    { label: 'D', tex: '\\left[\\dfrac{5\\pi}{12},\\ \\pi\\right]', correct: false }


  ];


  var optsEl = document.getElementById('options');


  opts.forEach(function(o){


    var card = document.createElement('div');


    card.className = 'option-card';


    card.innerHTML = '<div class="option-label">' + o.label + '</div><div class="option-content"></div>';


    optsEl.appendChild(card);


    katex.render(o.tex, card.querySelector('.option-content'), { displayMode: true, throwOnError: false });


    card.addEventListener('click', function(){


      var all = optsEl.querySelectorAll('.option-card');


      all.forEach(function(c){ c.classList.remove('correct','wrong'); });


      var fb = document.getElementById('feedback');


      if (o.correct) {


        card.classList.add('correct');


        fb.className = 'feedback correct show';


        fb.textContent = '✓ 回答正确！左端点探底到 -1，右端点不能反弹过 √3/2，所以 a ∈ [5π/12, 5π/6]。';


      } else {


        card.classList.add('wrong');


        fb.className = 'feedback wrong show';


        fb.textContent = '✗ 不对哦～cos从 √3/2 出发一路下滑，必须探底到 -1（a ≥ 5π/12），又不能反弹超过 √3（a ≤ 5π/6）。';


      }


    });


  });





  renderTex('s1', '令\\ u = 2x + \\dfrac{\\pi}{6}，\\ x \\in [0,\\ a]，\\ 则\\ u \\in \\left[\\dfrac{\\pi}{6},\\ 2a+\\dfrac{\\pi}{6}\\right]。');


  renderTex('s2', 'f(x)=2\\cos u，\\ 值域\\ [-2,\\ \\sqrt{3}]\\ 意味着\\ \\cos u \\in \\left[-1,\\ \\dfrac{\\sqrt{3}}{2}\\right]。');


  renderTex('s3', '从\\ u=\\dfrac{\\pi}{6}\\ 出发（此时\\ \\cos=\\dfrac{\\sqrt{3}}{2}，恰为上限），\\cos u\\ 随\\ u\\ 增大而减小：\\newline \\bullet\\ 到达\\ -1\\ 需要\\ u \\ge \\pi \\Rightarrow 2a+\\dfrac{\\pi}{6} \\ge \\pi \\Rightarrow a \\ge \\dfrac{5\\pi}{12}（必须探底）\\newline \\bullet\\ 但\\ \\cos\\ 下次回到\\ \\dfrac{\\sqrt{3}}{2}\\ 在\\ u=2\\pi-\\dfrac{\\pi}{6}=\\dfrac{11\\pi}{6}，\\newline \\ \\ \\ \\ 所以\\ 2a+\\dfrac{\\pi}{6} \\le \\dfrac{11\\pi}{6} \\Rightarrow a \\le \\dfrac{5\\pi}{6}。');


  renderTex('s4', '综上，\\ a \\in \\left[\\dfrac{5\\pi}{12},\\ \\dfrac{5\\pi}{6}\\right]。', true);


  document.getElementById('s5').innerHTML = '<div class="humor">口诀：左端点探底到 -1，右端点不能反弹过 √3/2。不能反弹太高，否则就超纲了！</div>';





  document.getElementById('nextBtn').addEventListener('click', function(){


    var steps = document.querySelectorAll('.step');


    if (stepIdx < steps.length) {


      steps[stepIdx].classList.add('show');


      stepIdx++;


    }


  });


  document.getElementById('resetBtn').addEventListener('click', function(){


    stepIdx = 0;


    document.querySelectorAll('.step').forEach(function(s){ s.classList.remove('show'); });


  });





  var canvas = document.getElementById('cv');


  var ctx = canvas.getContext('2d');


  var slider = document.getElementById('slider');


  var aVal = parseFloat(slider.value);





  function f(x) { return 2 * Math.cos(2*x + PI/6); }





  function draw() {


    var W = canvas.width, H = canvas.height;


    ctx.clearRect(0, 0, W, H);





    var padL = 50, padR = 30, padT = 30, padB = 50;


    var xMin = -0.3, xMax = PI + 0.3;


    var yMin = -2.6, yMax = 2.6;





    function toPx(x, y) {


      var px = padL + (x - xMin) / (xMax - xMin) * (W - padL - padR);


      var py = padT + (yMax - y) / (yMax - yMin) * (H - padT - padB);


      return [px, py];


    }





    ctx.strokeStyle = '#3a3a5a';


    ctx.lineWidth = 1;


    var origin = toPx(0, 0);


    ctx.beginPath();


    ctx.moveTo(padL, origin[1]);


    ctx.lineTo(W - padR, origin[1]);


    ctx.stroke();


    ctx.beginPath();


    ctx.moveTo(origin[0], padT);


    ctx.lineTo(origin[0], H - padB);


    ctx.stroke();





    ctx.fillStyle = '#8888aa';


    ctx.font = '12px sans-serif';


    ctx.textAlign = 'center';


    var marks = [0, PI/6, PI/3, PI/2, 2*PI/3, 5*PI/6, PI];


    var labels = ['0','π/6','π/3','π/2','2π/3','5π/6','π'];


    marks.forEach(function(m, i){


      var p = toPx(m, 0);


      ctx.beginPath();


      ctx.moveTo(p[0], origin[1]-4);


      ctx.lineTo(p[0], origin[1]+4);


      ctx.strokeStyle = '#555577';


      ctx.stroke();


      ctx.fillText(labels[i], p[0], origin[1] + 18);


    });


    ctx.textAlign = 'right';


    [-2, -1, 1, 2].forEach(function(v){


      var p = toPx(0, v);


      ctx.beginPath();


      ctx.moveTo(origin[0]-4, p[1]);


      ctx.lineTo(origin[0]+4, p[1]);


      ctx.strokeStyle = '#555577';


      ctx.stroke();


      ctx.fillText(String(v), origin[0]-8, p[1]+4);


    });





    var aPx = toPx(aVal, 0)[0];


    ctx.fillStyle = 'rgba(255,209,102,0.12)';


    ctx.fillRect(origin[0], padT, aPx - origin[0], H - padT - padB);


    ctx.strokeStyle = '#ffd166';


    ctx.setLineDash([6,4]);


    ctx.lineWidth = 2;


    ctx.beginPath();


    ctx.moveTo(aPx, padT);


    ctx.lineTo(aPx, H - padB);


    ctx.stroke();


    ctx.setLineDash([]);





    var sqrt3 = Math.sqrt(3);


    var yNeg2 = toPx(0, -2)[1];


    var ySqrt3 = toPx(0, sqrt3)[1];


    ctx.lineWidth = 1.5;


    ctx.setLineDash([5,5]);


    ctx.strokeStyle = '#e94560';


    ctx.beginPath(); ctx.moveTo(padL, yNeg2); ctx.lineTo(W-padR, yNeg2); ctx.stroke();


    ctx.strokeStyle = '#7c4dff';


    ctx.beginPath(); ctx.moveTo(padL, ySqrt3); ctx.lineTo(W-padR, ySqrt3); ctx.stroke();


    ctx.setLineDash([]);


    ctx.fillStyle = '#e94560'; ctx.textAlign='left';


    ctx.fillText('y = -2', W-padR-45, yNeg2-6);


    ctx.fillStyle = '#7c4dff';


    ctx.fillText('y = √3', W-padR-45, ySqrt3-6);





    var critX = [5*PI/12, 5*PI/6];


    critX.forEach(function(cx){


      var cp = toPx(cx, f(cx));


      ctx.fillStyle = '#ff6b6b';


      ctx.beginPath();


      ctx.arc(cp[0], cp[1], Math.abs(5), 0, 2*PI);


      ctx.fill();


      ctx.fillStyle = '#ff6b6b';


      ctx.font = '11px sans-serif';


      ctx.textAlign = 'center';


      var lbl = cx === 5*PI/12 ? '5π/12' : '5π/6';


      ctx.fillText(lbl, cp[0], cp[1] - 10);


    });





    ctx.strokeStyle = '#4ecca3';


    ctx.lineWidth = 2.5;


    ctx.beginPath();


    var first = true;


    for (var px = padL; px <= W - padR; px += 1) {


      var x = xMin + (px - padL) / (W - padL - padR) * (xMax - xMin);


      var y = f(x);


      var p = toPx(x, y);


      if (first) { ctx.moveTo(p[0], p[1]); first = false; }


      else ctx.lineTo(p[0], p[1]);


    }


    ctx.stroke();





    ctx.strokeStyle = '#ffd166';


    ctx.lineWidth = 4;


    ctx.beginPath();


    first = true;


    for (var x = 0; x <= aVal + 0.0001; x += 0.005) {


      var p = toPx(x, f(x));


      if (first) { ctx.moveTo(p[0], p[1]); first = false; }


      else ctx.lineTo(p[0], p[1]);


    }


    ctx.stroke();





    [0, aVal].forEach(function(x){


      var p = toPx(x, f(x));


      ctx.fillStyle = '#ffd166';


      ctx.beginPath();


      ctx.arc(p[0], p[1], Math.abs(4), 0, 2*PI);


      ctx.fill();


      ctx.strokeStyle = '#fff';


      ctx.lineWidth = 1.5;


      ctx.stroke();


    });





    updateBadges();


  }





  function computeMinMax() {


    var mn = Infinity, mx = -Infinity;


    for (var x = 0; x <= aVal; x += 0.001) {


      var y = f(x);


      if (y < mn) mn = y;


      if (y > mx) mx = y;


    }


    return [mn, mx];


  }





  function fmt(n) { return n.toFixed(3); }





  function updateBadges() {


    var mm = computeMinMax();


    var mn = mm[0], mx = mm[1];


    var minBadge = document.getElementById('minBadge');


    var maxBadge = document.getElementById('maxBadge');


    var statusBadge = document.getElementById('statusBadge');


    var failDetail = document.getElementById('failDetail');





    minBadge.textContent = 'min = ' + fmt(mn);


    maxBadge.textContent = 'max = ' + fmt(mx);





    var minOk = mn <= -2 + 0.01;


    var maxOk = mx <= Math.sqrt(3) + 0.01;





    if (minOk && maxOk) {


      statusBadge.className = 'badge ok';


      statusBadge.textContent = '值域正确 ✓';


      failDetail.textContent = '';


    } else {


      statusBadge.className = 'badge fail';


      statusBadge.textContent = '值域错误 ✗';


      var parts = [];


      if (!minOk) parts.push('最小值 ' + fmt(mn) + ' > -2，还没探底到 -1（a 太小）');


      if (!maxOk) parts.push('最大值 ' + fmt(mx) + ' > √3，反弹过头了（a 太大）');


      failDetail.textContent = '✗ ' + parts.join('；') + '。';


    }


  }





  function updateA() {


    aVal = parseFloat(slider.value);


    renderTex('aval', 'a = ' + fmt(aVal));


    draw();


  }





  function resize() {


    var rect = canvas.getBoundingClientRect();


    canvas.width = rect.width;


    canvas.height = 420;


    draw();


  }





  slider.addEventListener('input', updateA);





  function onTouchStart(e) { e.preventDefault(); }


  function onTouchMove(e) { e.preventDefault(); }


  canvas.addEventListener('touchstart', onTouchStart, { passive: false });


  canvas.addEventListener('touchmove', onTouchMove, { passive: false });





  window.addEventListener('resize', resize);





  resize();


  updateA();


  document.getElementById('step1').classList.add('show');


  stepIdx = 1;


})();


</script>

<script>(function(){
  'use strict';
  if (window.__cstatUI) return; window.__cstatUI = true;
  var CM = null;
  try { CM = JSON.parse(document.getElementById('c-meta').textContent); } catch(e){}
  if (!CM || !CM.id) return;
  var CID = CM.id;
  var CSTAT_KEY = 'cstat:' + CID;
  var RATE_KEY  = 'crate:' + CID;
  function readS(){ try{ return JSON.parse(localStorage.getItem(CSTAT_KEY))||{}; }catch(e){ return {}; } }
  function readR(){ try{ return JSON.parse(localStorage.getItem(RATE_KEY))||{}; }catch(e){ return {}; } }
  function record(state){
    var s = readS();
    s[state] = (s[state]||0)+1;
    var reset = false;
    if(state === 'skilled'){ if(s.fuzzy||s.forgot){ s.fuzzy = 0; s.forgot = 0; reset = true; } }
    s.ts = Date.now();
    try{ localStorage.setItem(CSTAT_KEY, JSON.stringify(s)); }catch(e){}
    try{ localStorage.setItem('cvisit:' + CID, JSON.stringify({ ts: Date.now() })); }catch(e){}
    window.dispatchEvent(new CustomEvent('cstat:change'));
    render();
    return reset;
  }
  window.__recordCourseState = record;
  function render(){
    var s = readS();
    var el = document.getElementById('cstat-counts');
    if (el) el.textContent = '✅'+(s.skilled||0)+' · 🟡'+(s.fuzzy||0)+' · ❌'+(s.forgot||0);
  }
  function flash(msg){
    var el = document.getElementById('cstat-flash'); if (!el) return;
    el.textContent = msg; el.classList.add('show'); clearTimeout(flash._t);
    flash._t = setTimeout(function(){ el.classList.remove('show'); }, 1800);
  }
  function bind(id, state, label, extra){
    var b = document.getElementById(id); if (!b) return;
    b.addEventListener('click', function(e){ e.stopPropagation();
      var reset = record(state); var n = readS()[state]||0;
      flash(label+' ×'+n+' 已记录' + (extra && reset ? extra : ''));
    });
  }
  // 评价课件：写入本地 crate:<CID> 并触发云端上报（菜单不显示计数）
  function rateLocal(id, field, label){
    var b = document.getElementById(id); if (!b) return;
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var r = readR(); r[field] = (r[field]||0)+1;
      try{ localStorage.setItem(RATE_KEY, JSON.stringify(r)); }catch(e){}
      window.dispatchEvent(new CustomEvent('cstat:change'));
      flash(label+'（已记下，计入云端）');
    });
  }
  function bindToggle(barId, labelId){
    var bar = document.getElementById(barId), lab = document.getElementById(labelId);
    if (!bar || !lab) return;
    lab.addEventListener('click', function(e){ e.stopPropagation(); bar.classList.toggle('collapsed'); });
  }
  function init(){
    bind('cstat-sk','skilled','✅ 答对','（部分对/答错已清零）');
    bind('cstat-fz','fuzzy','🟡 部分对');
    bind('cstat-fg','forgot','❌ 答错');
    rateLocal('crate-good','good','👍 好');
    rateLocal('crate-hard','hard','📕 课件不好懂');
    rateLocal('crate-teach','teach','🗣️ 没老师讲的好');
    bindToggle('cstat-bar','cstat-label');
    bindToggle('crate-bar','crate-label');
    render();
  }
  document.addEventListener('click', function(e){
    if(!(e.target.closest && e.target.closest('#cstat-bar'))) { var a=document.getElementById('cstat-bar'); if(a)a.classList.add('collapsed'); }
    if(!(e.target.closest && e.target.closest('#crate-bar'))) { var b=document.getElementById('crate-bar'); if(b)b.classList.add('collapsed'); }
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();</script>
<script>(function(){
  'use strict';
  if (window.__cstatReporter) return; window.__cstatReporter = true;
  var CM = null;
  try { CM = JSON.parse(document.getElementById('c-meta').textContent); } catch(e){}
  if (!CM || !CM.id) return;
  var CID = CM.id;
  var CSTAT_KEY = 'cstat:' + CID;
  var CRATE_KEY = 'crate:' + CID;
  var CVISIT_KEY = 'cvisit:' + CID;
  var SYNC_KEY  = 'csync:' + CID;
  var AUTO_KEY  = 'course_auto_sync';
  var CFG_KEY   = 'course_cloud_cfg';
  var DEFAULT_CLOUD = { url: 'https://mixuqjognbdrafrrlivc.supabase.co', key: 'sb_publishable_D0ha7g4X4LutG-3hxCguSA_pwyQLrVX' };
  var STATS_TABLE = 'course_stats';
  function readJSON(k, def){ try{ var v = JSON.parse(localStorage.getItem(k)); return (v==null)?def:v; }catch(e){ return def; } }
  function saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function cloudCfg(){ var c = readJSON(CFG_KEY, null); if (c && c.url && c.key && c.url.indexOf('vajgltnfpdjpnsoknoma') < 0) return c; return DEFAULT_CLOUD; }
  function autoOn(){ try{ return localStorage.getItem(AUTO_KEY) !== '0'; }catch(e){ return true; } }
  // 仅上报课件页 UI 可改的字段：自评(cstat) + 评价(crate)。redo/notes 由门户/笔记脚本各自维护，避免回写覆盖。
  function compute(){
    var s = readJSON(CSTAT_KEY, {});
    var r = readJSON(CRATE_KEY, {});
    return { skilled:s.skilled||0, fuzzy:s.fuzzy||0, forgot:s.forgot||0,
             rg: r.good||0, rh: r.hard||0, rt: r.teach||0 };
  }
  var syncBase = readJSON(SYNC_KEY, {skilled:0,fuzzy:0,forgot:0,rg:0,rh:0,rt:0});
  var lastLocal = '', lastCloud = '', cloudTimer = null, inFlight = false, rtAlive = false;
  function fetchCloudRow(cfg, cb){
    try {
      var ctl = null, timer = null; try { ctl = new AbortController(); } catch(e){}
      var u = cfg.url.replace(/\/+$/,'') + '/rest/v1/' + STATS_TABLE + '?course_id=eq.' + encodeURIComponent(CID) + '&select=*';
      var req = { headers: { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key } };
      if (ctl) { req.signal = ctl.signal; timer = setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, 5000); }
      fetch(u, req).then(function(r){ return r.json(); }).then(function(j){
        if (timer) clearTimeout(timer); cb(Array.isArray(j) && j.length ? j[0] : null);
      }).catch(function(){ if (timer) clearTimeout(timer); cb(null); });
    } catch(e){ cb(null); }
  }
  function refreshFromCloud(){ if (!autoOn()) return; var cfg = cloudCfg(); fetchCloudRow(cfg, function(row){ if(row) saveJSON('ccloud:'+CID, row); }); }
  function report(){
    var s = compute(); var snap = JSON.stringify(s);
    if (snap !== lastLocal){ lastLocal = snap; try{ localStorage.setItem(CSTAT_KEY, JSON.stringify({ skilled:s.skilled, fuzzy:s.fuzzy, forgot:s.forgot, ts:Date.now() })); }catch(e){} }
    var vt = 0; try{ var v = readJSON(CVISIT_KEY, null); if (v && v.ts) vt = v.ts; }catch(e){}
    if (!vt){ vt = Date.now(); try{ localStorage.setItem(CVISIT_KEY, JSON.stringify({ts:vt})); }catch(e){} }
    if (snap !== lastCloud && autoOn()){ lastCloud = snap; clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 3000); }
  }
  function pushCloud(){
    if (inFlight){ setTimeout(pushCloud, 1500); return; } inFlight = true;
    var s = compute(); var cfg = cloudCfg();
    var vt = 0; try{ var v = readJSON(CVISIT_KEY, null); if (v && v.ts) vt = v.ts; }catch(e){}
    fetchCloudRow(cfg, function(row){
      var base = row || {};
      var d = { skilled: s.skilled - syncBase.skilled, fuzzy: s.fuzzy - syncBase.fuzzy, forgot: s.forgot - syncBase.forgot,
                rg: s.rg - syncBase.rg, rh: s.rh - syncBase.rh, rt: s.rt - syncBase.rt };
      var newSync = { skilled:s.skilled, fuzzy:s.fuzzy, forgot:s.forgot, rg:s.rg, rh:s.rh, rt:s.rt };
      var payload = {
        course_id: CID,
        skilled: (base.skilled||0) + d.skilled,
        fuzzy:   (base.fuzzy||0) + d.fuzzy,
        forgot:  (base.forgot||0) + d.forgot,
        rating_good:  (base.rating_good||0) + d.rg,
        rating_hard:  (base.rating_hard||0) + d.rh,
        rating_teach: (base.rating_teach||0) + d.rt,
        updated_at: new Date().toISOString(),
        last_visit: vt ? new Date(vt).toISOString() : null
      };
      var ctl = null, timer = null; try { ctl = new AbortController(); } catch(e){}
      var opts = { method:'POST', headers:{ apikey:cfg.key, Authorization:'Bearer '+cfg.key, 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify([payload]) };
      if (ctl){ opts.signal = ctl.signal; timer = setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, 8000); }
      fetch(cfg.url.replace(/\/+$/, '') + '/rest/v1/' + STATS_TABLE, opts)
        .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); saveJSON(SYNC_KEY, newSync); syncBase = newSync; })
        .catch(function(){})
        .then(function(){ if (timer) clearTimeout(timer); inFlight = false; });
    });
  }
  function subscribeRealtime(){
    try {
      if (typeof WebSocket === 'undefined') return;
      var cfg = cloudCfg();
      var wsUrl = cfg.url.replace(/^https/, 'wss').replace(/\/+$/, '') + '/realtime/v1?apikey=' + encodeURIComponent(cfg.key) + '&vsn=1.0.0';
      var ws = new WebSocket(wsUrl); var chan = 'cstat-' + CID; var hb = null;
      ws.onopen = function(){
        rtAlive = true;
        ws.send(JSON.stringify({ topic: chan, event: 'phx_join', payload: { config: { postgres_changes: [ { event: 'UPDATE', schema: 'public', table: STATS_TABLE, filter: 'course_id=eq.' + CID } ] } }, ref: '1' }));
        hb = setInterval(function(){ try{ ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(Date.now()) })); }catch(e){} }, 25000);
      };
      ws.onmessage = function(ev){ try{ var m = JSON.parse(ev.data); if (m && m.topic === chan && m.event === 'postgres_changes') refreshFromCloud(); }catch(e){} };
      ws.onerror = function(){ };
      ws.onclose = function(){ if (hb) clearInterval(hb); setTimeout(function(){ if (autoOn()) subscribeRealtime(); }, 6000); };
    } catch(e){}
  }
  function startPolling(){ setInterval(function(){ if (autoOn() && !document.hidden) refreshFromCloud(); }, 5000); }
  function watch(){
    report();
    window.addEventListener('cstat:change', report);
    window.addEventListener('storage', function(e){ if (e.key === CSTAT_KEY) report(); });
    window.addEventListener('visibilitychange', function(){ if (!document.hidden) report(); });
    setInterval(function(){ if (!document.hidden) report(); }, 5000);
    refreshFromCloud(); startPolling(); subscribeRealtime();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch);
  else watch();
})();</script>

<script>
/* ===== 专题练串联导航：URL 带 ?tr=<序号> 且本地有 train_group 时显示 ===== */
(function(){
  'use strict';
  if (window.__tnav) return;
  window.__tnav = true;
  var ti = NaN;
  try { ti = parseInt(new URLSearchParams(location.search).get('tr'), 10); } catch(e){ if(location.search.indexOf('tr=')>=0){ var m=location.search.match(/tr=(\d+)/); if(m)ti=parseInt(m[1],10); } }
  if (isNaN(ti) || ti < 0) return;
  var g = null;
  try { g = JSON.parse(localStorage.getItem('train_group')); } catch(e){}
  if (!g || !g.urls || !g.urls.length) return;
  var urls = g.urls;
  function toUrl(u, idx){
    var sep = u.indexOf('?') >= 0 ? '&' : '?';
    return u.replace(/^lessons\//, '../') + sep + 'tr=' + idx;
  }
  function build(){
    var bar = document.createElement('div');
    bar.id = 'tnav-bar';
    var prev = ti > 0
      ? '<a id="tnav-prev" href="' + toUrl(urls[ti-1], ti-1) + '" title="快捷键 ←">\u2190 \u4e0a\u4e00\u8bfe</a>'
      : '<span class="tnav-off">\u2190 \u4e0a\u4e00\u8bfe</span>';
    var next = ti < urls.length - 1
      ? '<a id="tnav-next" href="' + toUrl(urls[ti+1], ti+1) + '" title="快捷键 \u2192">\u4e0b\u4e00\u8bfe \u2192</a>'
      : '<span class="tnav-off">\u4e0b\u4e00\u8bfe \u2192</span>';
    bar.innerHTML = '<span id="tnav-tag">🎯 \u4e13\u9898\u7ec3</span>' + prev
      + '<span id="tnav-pos">' + (ti+1) + ' / ' + urls.length + '</span>' + next
      + '<span id="tnav-exit" title="\u9000\u51fa\u4e13\u9898\u7ec3\u4e32\u8054">✕</span>';
    document.body.appendChild(bar);
    document.getElementById('tnav-exit').addEventListener('click', function(){
      bar.remove();
      try { localStorage.removeItem('train_group'); } catch(e){}
    });
  }
  document.addEventListener('keydown', function(e){
    if (!document.getElementById('tnav-bar')) return;
    if (e.key === 'ArrowRight' && ti < urls.length - 1) location.href = toUrl(urls[ti+1], ti+1);
    else if (e.key === 'ArrowLeft' && ti > 0) location.href = toUrl(urls[ti-1], ti-1);
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
  else build();
})();
</script>


<script>
/* ===== 浮动工具栏长按拖动：自评/评价/专题练串联条，位置记忆 ===== */
(function(){
  'use strict';
  if (window.__bardrag) return;
  window.__bardrag = true;
  var IDS = ['cstat-bar', 'crate-bar', 'tnav-bar'];
  var LONG = 400, MOVE = 6;
  function key(id){ return 'bar_pos:' + id; }
  function place(el, l, t){
    var w = el.offsetWidth || 0, h = el.offsetHeight || 0;
    l = Math.min(Math.max(l, 4), window.innerWidth - w - 4);
    t = Math.min(Math.max(t, 4), window.innerHeight - h - 4);
    el.style.left = l + 'px';
    el.style.top = t + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.transform = 'none'; // 覆盖 tnav-bar 的 translateX(-50%)
  }
  function restore(el){
    try{
      var p = JSON.parse(localStorage.getItem(key(el.id)));
      if (p && typeof p.left === 'number') place(el, p.left, p.top);
    }catch(e){}
  }
  function makeDraggable(el){
    if (!el || el.__drag) return;
    el.__drag = true;
    var timer = null, sx = 0, sy = 0, ox = 0, oy = 0, dragging = false, pid = null;
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', function(e){
      if (e.button) return;
      sx = e.clientX; sy = e.clientY;
      var r = el.getBoundingClientRect(); ox = r.left; oy = r.top;
      dragging = false; pid = e.pointerId;
      clearTimeout(timer);
      timer = setTimeout(function(){
        dragging = true;
        el.classList.add('bar-dragging');
        try { el.setPointerCapture(pid); } catch(e2){}
        try { navigator.vibrate && navigator.vibrate(30); } catch(e2){}
      }, LONG);
    });
    el.addEventListener('pointermove', function(e){
      if (!dragging){
        if (Math.abs(e.clientX - sx) > MOVE || Math.abs(e.clientY - sy) > MOVE) clearTimeout(timer);
        return;
      }
      e.preventDefault();
      place(el, ox + e.clientX - sx, oy + e.clientY - sy);
    });
    function up(){
      clearTimeout(timer);
      if (dragging){
        el.classList.remove('bar-dragging');
        try{
          localStorage.setItem(key(el.id), JSON.stringify({
            left: parseFloat(el.style.left), top: parseFloat(el.style.top) }));
        }catch(e2){}
      }
      dragging = false;
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    window.addEventListener('resize', function(){ restore(el); });
  }
  function init(){
    IDS.forEach(function(id){
      var el = document.getElementById(id);
      if (el){ makeDraggable(el); restore(el); }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>


<script>
(function(){
  var CID=(function(){
    try{
      var m=document.querySelector('script[type="application/json"]#c-meta');
      if(m){var j=JSON.parse(m.textContent);if(j&&j.id)return j.id;}
    }catch(e){}
    return 'course_'+(location.pathname.replace(/[^a-z0-9]+/gi,'_').slice(-40));
  })();
  var DEF=['知道套路但忘了','套路记得，没想到在这用','完全不知道有套路','计算出错','看错题干','其他'];
  function vocab(){try{var v=JSON.parse(localStorage.getItem('note_tags'));if(Array.isArray(v)&&v.length)return v;}catch(e){}return DEF.slice();}
  function localNotes(){try{var v=JSON.parse(localStorage.getItem('cnote:'+CID));return Array.isArray(v)?v:[];}catch(e){return[];}}
  function saveLocal(a){try{localStorage.setItem('cnote:'+CID,JSON.stringify(a));}catch(e){}}
  var DEFAULT_CLOUD = { url:'https://mixuqjognbdrafrrlivc.supabase.co', key:'sb_publishable_D0ha7g4X4LutG-3hxCguSA_pwyQLrVX' };
  var CFG=(function(){
    var src=document.documentElement.innerHTML;
    var mu=src.match(/https:\/\/[a-z0-9]+\.supabase\.co/);
    var mk=src.match(/eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+/);
    if(mu&&mu[0]&&mk&&mk[0]) return {url:mu[0],key:mk[0]};
    return DEFAULT_CLOUD;
  })();
  function pushCloud(rec){
    if(!CFG.url||!CFG.key)return;
    try{
      fetch(CFG.url+'/rest/v1/course_notes',{method:'POST',
        headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify([{course_id:CID,tags:rec.tags,note:rec.note,created_at:new Date(rec.ts).toISOString()}])
      }).catch(function(e){console.warn('[cnote] push fail',e);});
    }catch(e){}
  }
  var pill=document.createElement('button');pill.id='cnotePill';pill.type='button';pill.textContent='💡 记一下错误原因';
  document.body.appendChild(pill);
  var pop=document.createElement('div');pop.id='cnotePop';
  document.body.appendChild(pop);
  var sel={};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function saveRec(tags,txt){
    var rec={tags:tags,note:txt,ts:Date.now()};
    var arr=localNotes();arr.push(rec);saveLocal(arr);
    pushCloud(rec);
    return rec;
  }
  function delCloud(rec){
    if(!CFG.url||!CFG.key)return;
    try{
      var iso=new Date(rec.ts).toISOString();
      fetch(CFG.url+'/rest/v1/course_notes?course_id=eq.'+encodeURIComponent(CID)+'&created_at=eq.'+encodeURIComponent(iso),{method:'DELETE',
        headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key}}).catch(function(e){console.warn('[cnote] del fail',e);});
    }catch(e){}
  }
  function cancelRec(tag,rec){
    var arr=localNotes();
    for(var i=arr.length-1;i>=0;i--){
      if(arr[i].ts===rec.ts&&(arr[i].tags||[]).length===1&&arr[i].tags[0]===tag){
        arr.splice(i,1);saveLocal(arr);delCloud(rec);return true;
      }
    }
    return false;
  }
  function renderPop(){
    var vs=vocab(),n=localNotes();
    sel={};
    var h='<div class="cp-head">这题哪里没想到？<span class="cp-x" id="cnoteX">×</span></div>';
    h+='<div class="cp-tip">点标签即记一条 · 再点同一标签取消</div>';
    h+='<div class="cp-tags">';
    vs.forEach(function(t){h+='<span class="cp-tag" data-t="'+esc(t)+'">'+esc(t)+'</span>';});
    h+='</div>';
    h+='<input id="cnoteTxt" placeholder="补充一句话（可不填）">';
    h+='<div class="cp-foot"><span class="cp-cnt">本课已有 '+n.length+' 条记录</span><button id="cnoteSave" type="button">只记备注</button></div>';
    if(n.length){
      var last=n[n.length-1];
      var d=new Date(last.ts||0),p=function(x){return ('0'+x).slice(-2);};
      h+='<div class="cp-hist">上次：'+(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())
        +((last.tags&&last.tags.length)?(' · '+last.tags.join('/')):'')+(last.note?(' · '+last.note):'')+'</div>';
    }
    h+='<div id="cnoteCloud" class="cp-cloud"><div class="cp-tip">加载其他人记的错…</div></div>';
    pop.innerHTML=h;
    pop.querySelectorAll('.cp-tag').forEach(function(el){
      el.addEventListener('click',function(){
        var t=el.getAttribute('data-t');
        var cnt=pop.querySelector('.cp-cnt');
        if(sel[t]){
          if(cancelRec(t,sel[t])){
            delete sel[t];el.classList.remove('done');
            if(cnt)cnt.textContent='✗ 已取消「'+t+'」· 本课共 '+localNotes().length+' 条';
            updBlink();
          }
          return;
        }
        var txt=(pop.querySelector('#cnoteTxt').value||'').trim();
        var rec=saveRec([t],txt);
        sel[t]=rec;
        pop.querySelector('#cnoteTxt').value='';
        el.classList.add('done');
        if(cnt)cnt.textContent='✓ 已记「'+t+'」· 本课共 '+localNotes().length+' 条';
        updBlink();
      });
    });
    var xv=pop.querySelector('#cnoteX');if(xv)xv.addEventListener('click',closePop);
    var sv=pop.querySelector('#cnoteSave');
    sv.addEventListener('click',function(){
      var txt=(pop.querySelector('#cnoteTxt').value||'').trim();
      if(!txt){pop.querySelector('#cnoteTxt').focus();return;}
      saveRec([],txt);
      pop.querySelector('#cnoteTxt').value='';
      var cnt=pop.querySelector('.cp-cnt');
      if(cnt)cnt.textContent='✓ 已记备注 · 本课共 '+localNotes().length+' 条';
      updBlink();
    });
  }
  /* ---------- 读回其他人记的错（跨设备实时） ---------- */
  function cloudNotes(cb){
    if(!CFG.url||!CFG.key) return cb([]);
    try{
      var u=CFG.url.replace(/\/+$/,'')+'/rest/v1/course_notes?course_id=eq.'+encodeURIComponent(CID)+
           '&select=tags,note,created_at&order=created_at.desc';
      fetch(u,{headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key}})
        .then(function(r){return r.json();}).then(function(j){cb(Array.isArray(j)?j:[]);})
        .catch(function(){cb([]);});
    }catch(e){cb([]);}
  }
  function renderCloudNotes(){
    var box=pop.querySelector('#cnoteCloud'); if(!box) return;
    cloudNotes(function(list){
      if(!list.length){ box.innerHTML='<div class="cp-tip">还没有其他人记的错</div>'; return; }
      var h='<div class="cp-sub">👀 其他人记的错（'+list.length+'）</div>';
      list.slice(0,12).forEach(function(r){
        var when=r.created_at?(' · '+r.created_at.slice(5,16).replace('T',' ')):'';
        h+='<div class="cp-citem">'+ (r.tags&&r.tags.length?('<b>'+esc(r.tags.join('/'))+'</b>'):'') +
            (r.note?(' '+esc(r.note)):'') + when + '</div>';
      });
      box.innerHTML=h;
    });
  }
  var cloudTimer=null;
  function openPop(){
    renderPop();pop.classList.add('open');
    renderCloudNotes();
    clearInterval(cloudTimer);
    cloudTimer=setInterval(function(){ if(pop.classList.contains('open')) renderCloudNotes(); }, 8000);
  }
  function closePop(){pop.classList.remove('open');clearInterval(cloudTimer);}
  function closePop(){pop.classList.remove('open');}
  var key='bar_pos:cnote';
  var blinkSec=20;
  try{blinkSec=Math.max(1,Math.min(60,Math.round(+localStorage.getItem('cnote_blink_sec'))||20));}catch(e){}
  pill.style.setProperty('--blink-int',blinkSec+'s');
  function updBlink(){if(localNotes().length)pill.classList.remove('blink');else pill.classList.add('blink');}
  updBlink();
  try{
    var p=JSON.parse(localStorage.getItem(key)||'null');
    if(p&&p.left!=null){pill.style.left=p.left+'px';pill.style.top=p.top+'px';pill.style.right='auto';pill.style.bottom='auto';}
  }catch(e){}
  var timer=null,dragging=false,moved=false,arm=false,sx=0,sy=0,ox=0,oy=0;
  pill.addEventListener('pointerdown',function(e){
    arm=true;dragging=false;moved=false;sx=e.clientX;sy=e.clientY;
    var r=pill.getBoundingClientRect();ox=r.left;oy=r.top;
    timer=setTimeout(function(){dragging=true;pill.classList.add('drag');},400);
    e.preventDefault();
  });
  window.addEventListener('pointermove',function(e){
    if(!dragging)return;moved=true;
    var nl=ox+(e.clientX-sx),nt=oy+(e.clientY-sy);
    nl=Math.max(4,Math.min(window.innerWidth-(pill.offsetWidth||170),nl));
    nt=Math.max(4,Math.min(window.innerHeight-60,nt));
    pill.style.left=nl+'px';pill.style.top=nt+'px';pill.style.right='auto';pill.style.bottom='auto';
  });
  window.addEventListener('pointerup',function(e){
    if(arm){
      arm=false;clearTimeout(timer);
      if(dragging&&moved){
        dragging=false;pill.classList.remove('drag');
        try{localStorage.setItem(key,JSON.stringify({left:pill.offsetLeft,top:pill.offsetTop}));}catch(err){}
      }else{
        dragging=false;pill.classList.remove('drag');
        if(pop.classList.contains('open'))closePop();else openPop();
      }
      return;
    }
    if(dragging)return;
    if(pop.classList.contains('open')&&!pop.contains(e.target)&&!pill.contains(e.target))closePop();
  });
})();
</script>
