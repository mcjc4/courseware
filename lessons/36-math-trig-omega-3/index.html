      已知函数 <span id="f1"></span> 在区间 <span id="interval"></span> 上的值域为

      <div class="legend-item"><span class="legend-box" style="background:#4ecca3"></span>f(x)=2cos(2x+π/6)</div>

      <div class="legend-item"><span class="legend-box" style="background:#e94560"></span>y = -2</div>

<script>
(function(){
  var PI = Math.PI;
  var stepIdx = 0;

  function renderTex(id, tex, display) {
    var el = document.getElementById(id);
    if (el) {
      katex.render(tex, el, { displayMode: !!display, throwOnError: false });
    }
  }

  renderTex('f1', 'f(x)=2\\cos\\left(2x+\\dfrac{\\pi}{6}\\right)');
  renderTex('interval', '[0,\\ a]');
  renderTex('range', '[-2,\\ \\sqrt{3}]');
  renderTex('avar', 'a');
  renderTex('albl', 'a =');

  var opts = [
    { label: 'A', tex: '\\left[\\dfrac{5\\pi}{12},\\ \\dfrac{5\\pi}{6}\\right]', correct: true },
    { label: 'B', tex: '\\left[\\dfrac{5\\pi}{12},\\ \\dfrac{11\\pi}{12}\\right]', correct: false },
    { label: 'C', tex: '\\left[\\dfrac{2\\pi}{5},\\ \\dfrac{5\\pi}{12}\\right]', correct: false },
    { label: 'D', tex: '\\left[\\dfrac{5\\pi}{12},\\ \\pi\\right]', correct: false }
  ];
  var optsEl = document.getElementById('options');
  opts.forEach(function(o){
    var card = document.createElement('div');
    card.className = 'option-card';
    card.innerHTML = '<div class="option-label">' + o.label + '</div><div class="option-content"></div>';
    optsEl.appendChild(card);
    katex.render(o.tex, card.querySelector('.option-content'), { displayMode: true, throwOnError: false });
    card.addEventListener('click', function(){
      var all = optsEl.querySelectorAll('.option-card');
      all.forEach(function(c){ c.classList.remove('correct','wrong'); });
      var fb = document.getElementById('feedback');
      if (o.correct) {
        card.classList.add('correct');
        fb.className = 'feedback correct show';
        fb.textContent = '✓ 回答正确！左端点探底到 -1，右端点不能反弹过 √3/2，所以 a ∈ [5π/12, 5π/6]。';
      } else {
        card.classList.add('wrong');
        fb.className = 'feedback wrong show';
        fb.textContent = '✗ 不对哦～cos从 √3/2 出发一路下滑，必须探底到 -1（a ≥ 5π/12），又不能反弹超过 √3（a ≤ 5π/6）。';
      }
    });
  });

  renderTex('s1', '令\\ u = 2x + \\dfrac{\\pi}{6}，\\ x \\in [0,\\ a]，\\ 则\\ u \\in \\left[\\dfrac{\\pi}{6},\\ 2a+\\dfrac{\\pi}{6}\\right]。');
  renderTex('s2', 'f(x)=2\\cos u，\\ 值域\\ [-2,\\ \\sqrt{3}]\\ 意味着\\ \\cos u \\in \\left[-1,\\ \\dfrac{\\sqrt{3}}{2}\\right]。');
  renderTex('s3', '从\\ u=\\dfrac{\\pi}{6}\\ 出发（此时\\ \\cos=\\dfrac{\\sqrt{3}}{2}，恰为上限），\\cos u\\ 随\\ u\\ 增大而减小：\\newline \\bullet\\ 到达\\ -1\\ 需要\\ u \\ge \\pi \\Rightarrow 2a+\\dfrac{\\pi}{6} \\ge \\pi \\Rightarrow a \\ge \\dfrac{5\\pi}{12}（必须探底）\\newline \\bullet\\ 但\\ \\cos\\ 下次回到\\ \\dfrac{\\sqrt{3}}{2}\\ 在\\ u=2\\pi-\\dfrac{\\pi}{6}=\\dfrac{11\\pi}{6}，\\newline \\ \\ \\ \\ 所以\\ 2a+\\dfrac{\\pi}{6} \\le \\dfrac{11\\pi}{6} \\Rightarrow a \\le \\dfrac{5\\pi}{6}。');
  renderTex('s4', '综上，\\ a \\in \\left[\\dfrac{5\\pi}{12},\\ \\dfrac{5\\pi}{6}\\right]。', true);
  document.getElementById('s5').innerHTML = '<div class="humor">口诀：左端点探底到 -1，右端点不能反弹过 √3/2。不能反弹太高，否则就超纲了！</div>';

  document.getElementById('nextBtn').addEventListener('click', function(){
    var steps = document.querySelectorAll('.step');
    if (stepIdx < steps.length) {
      steps[stepIdx].classList.add('show');
      stepIdx++;
    }
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    stepIdx = 0;
    document.querySelectorAll('.step').forEach(function(s){ s.classList.remove('show'); });
  });

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var slider = document.getElementById('slider');
  var aVal = parseFloat(slider.value);

  function f(x) { return 2 * Math.cos(2*x + PI/6); }

  function draw() {
    var W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    var padL = 50, padR = 30, padT = 30, padB = 50;
    var xMin = -0.3, xMax = PI + 0.3;
    var yMin = -2.6, yMax = 2.6;

    function toPx(x, y) {
      var px = padL + (x - xMin) / (xMax - xMin) * (W - padL - padR);
      var py = padT + (yMax - y) / (yMax - yMin) * (H - padT - padB);
      return [px, py];
    }

    ctx.strokeStyle = '#3a3a5a';
    ctx.lineWidth = 1;
    var origin = toPx(0, 0);
    ctx.beginPath();
    ctx.moveTo(padL, origin[1]);
    ctx.lineTo(W - padR, origin[1]);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(origin[0], padT);
    ctx.lineTo(origin[0], H - padB);
    ctx.stroke();

    ctx.fillStyle = '#8888aa';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    var marks = [0, PI/6, PI/3, PI/2, 2*PI/3, 5*PI/6, PI];
    var labels = ['0','π/6','π/3','π/2','2π/3','5π/6','π'];
    marks.forEach(function(m, i){
      var p = toPx(m, 0);
      ctx.beginPath();
      ctx.moveTo(p[0], origin[1]-4);
      ctx.lineTo(p[0], origin[1]+4);
      ctx.strokeStyle = '#555577';
      ctx.stroke();
      ctx.fillText(labels[i], p[0], origin[1] + 18);
    });
    ctx.textAlign = 'right';
    [-2, -1, 1, 2].forEach(function(v){
      var p = toPx(0, v);
      ctx.beginPath();
      ctx.moveTo(origin[0]-4, p[1]);
      ctx.lineTo(origin[0]+4, p[1]);
      ctx.strokeStyle = '#555577';
      ctx.stroke();
      ctx.fillText(String(v), origin[0]-8, p[1]+4);
    });

    var aPx = toPx(aVal, 0)[0];
    ctx.fillStyle = 'rgba(255,209,102,0.12)';
    ctx.fillRect(origin[0], padT, aPx - origin[0], H - padT - padB);
    ctx.strokeStyle = '#ffd166';
    ctx.setLineDash([6,4]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(aPx, padT);
    ctx.lineTo(aPx, H - padB);
    ctx.stroke();
    ctx.setLineDash([]);

    var sqrt3 = Math.sqrt(3);
    var yNeg2 = toPx(0, -2)[1];
    var ySqrt3 = toPx(0, sqrt3)[1];
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5,5]);
    ctx.strokeStyle = '#e94560';
    ctx.beginPath(); ctx.moveTo(padL, yNeg2); ctx.lineTo(W-padR, yNeg2); ctx.stroke();
    ctx.strokeStyle = '#7c4dff';
    ctx.beginPath(); ctx.moveTo(padL, ySqrt3); ctx.lineTo(W-padR, ySqrt3); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#e94560'; ctx.textAlign='left';
    ctx.fillText('y = -2', W-padR-45, yNeg2-6);
    ctx.fillStyle = '#7c4dff';
    ctx.fillText('y = √3', W-padR-45, ySqrt3-6);

    var critX = [5*PI/12, 5*PI/6];
    critX.forEach(function(cx){
      var cp = toPx(cx, f(cx));
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(cp[0], cp[1], Math.abs(5), 0, 2*PI);
      ctx.fill();
      ctx.fillStyle = '#ff6b6b';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      var lbl = cx === 5*PI/12 ? '5π/12' : '5π/6';
      ctx.fillText(lbl, cp[0], cp[1] - 10);
    });

    ctx.strokeStyle = '#4ecca3';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    var first = true;
    for (var px = padL; px <= W - padR; px += 1) {
      var x = xMin + (px - padL) / (W - padL - padR) * (xMax - xMin);
      var y = f(x);
      var p = toPx(x, y);
      if (first) { ctx.moveTo(p[0], p[1]); first = false; }
      else ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke();

    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 4;
    ctx.beginPath();
    first = true;
    for (var x = 0; x <= aVal + 0.0001; x += 0.005) {
      var p = toPx(x, f(x));
      if (first) { ctx.moveTo(p[0], p[1]); first = false; }
      else ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke();

    [0, aVal].forEach(function(x){
      var p = toPx(x, f(x));
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(p[0], p[1], Math.abs(4), 0, 2*PI);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });

    updateBadges();
  }

  function computeMinMax() {
    var mn = Infinity, mx = -Infinity;
    for (var x = 0; x <= aVal; x += 0.001) {
      var y = f(x);
      if (y < mn) mn = y;
      if (y > mx) mx = y;
    }
    return [mn, mx];
  }

  function fmt(n) { return n.toFixed(3); }

  function updateBadges() {
    var mm = computeMinMax();
    var mn = mm[0], mx = mm[1];
    var minBadge = document.getElementById('minBadge');
    var maxBadge = document.getElementById('maxBadge');
    var statusBadge = document.getElementById('statusBadge');
    var failDetail = document.getElementById('failDetail');

    minBadge.textContent = 'min = ' + fmt(mn);
    maxBadge.textContent = 'max = ' + fmt(mx);

    var minOk = mn <= -2 + 0.01;
    var maxOk = mx <= Math.sqrt(3) + 0.01;

    if (minOk && maxOk) {
      statusBadge.className = 'badge ok';
      statusBadge.textContent = '值域正确 ✓';
      failDetail.textContent = '';
    } else {
      statusBadge.className = 'badge fail';
      statusBadge.textContent = '值域错误 ✗';
      var parts = [];
      if (!minOk) parts.push('最小值 ' + fmt(mn) + ' > -2，还没探底到 -1（a 太小）');
      if (!maxOk) parts.push('最大值 ' + fmt(mx) + ' > √3，反弹过头了（a 太大）');
      failDetail.textContent = '✗ ' + parts.join('；') + '。';
    }
  }

  function updateA() {
    aVal = parseFloat(slider.value);
    renderTex('aval', 'a = ' + fmt(aVal));
    draw();
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = 420;
    draw();
  }

  slider.addEventListener('input', updateA);

  function onTouchStart(e) { e.preventDefault(); }
  function onTouchMove(e) { e.preventDefault(); }
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });

  window.addEventListener('resize', resize);

  resize();
  updateA();
  document.getElementById('step1').classList.add('show');
  stepIdx = 1;
})();
</script>

<div id="crate-bar" title="课件评价：这套课件质量如何">
  <span id="crate-label">⭐ 评价课件</span>
  <button type="button" id="crate-good" class="crg">👍 好</button>
  <button type="button" id="crate-hard" class="crh">📕 课件不好懂</button>
  <button type="button" id="crate-teach" class="crt">🗣️ 没老师讲的好</button>
  <label id="credo-box" title="每次勾选记录一次重做并更新时间；取消勾选只改状态、历史次数保留"><input type="checkbox" id="credo-chk"> ✍️ 已独立重做<span id="credo-info"></span></label>
  <span id="crate-counts"></span>
  <span id="crate-flash"></span>
</div>
<div id="cstat-bar" title="学习自评：点击累计计数">
  <span id="cstat-label">📋 自评</span>
  <button type="button" id="cstat-sk" class="csk">✅ 熟练</button>
  <button type="button" id="cstat-fz" class="cfz">😐 模糊</button>
  <button type="button" id="cstat-fg" class="cfg">❌ 忘记</button>
  <span id="cstat-counts"></span>
  <span id="cstat-flash"></span>
</div>
<script>
/* ===== 三状态自评：熟练/模糊/忘记（累计计数，每次点击 +1）===== */
(function(){
  'use strict';
  if (window.__cstatUI) return;
  window.__cstatUI = true;
  var CM = null;
  try { CM = JSON.parse(document.getElementById('c-meta').textContent); } catch(e){}
  if (!CM || !CM.id) return;
  var CSTAT_KEY = 'cstat:' + CM.id;
  var CRATE_KEY = 'crate:' + CM.id;
  var CREDO_KEY = 'credo:' + CM.id;
  function readS(){ try{ return JSON.parse(localStorage.getItem(CSTAT_KEY))||{}; }catch(e){ return {}; } }
  function recordCourseState(state){
    var s = readS();
    s[state] = (s[state]||0)+1;
    var reset = false;
    if(state === 'skilled'){ if(s.fuzzy||s.forgot){ s.fuzzy = 0; s.forgot = 0; reset = true; } }
    s.ts = Date.now();
    try{ localStorage.setItem(CSTAT_KEY, JSON.stringify(s)); }catch(e){}
    try{ localStorage.setItem('cvisit:' + CM.id, JSON.stringify({ ts: Date.now() })); }catch(e){}
    window.dispatchEvent(new CustomEvent('cstat:change'));
    render(); renderR();
    return reset;
  }
  window.__recordCourseState = recordCourseState;
  function readR(){ try{ return JSON.parse(localStorage.getItem(CRATE_KEY))||{}; }catch(e){ return {}; } }
  function rateCourse(kind){
    var r = readR();
    r[kind] = (r[kind]||0)+1;
    r.ts = Date.now();
    try{ localStorage.setItem(CRATE_KEY, JSON.stringify(r)); }catch(e){}
    window.dispatchEvent(new CustomEvent('cstat:change'));
    renderR();
    return r[kind]||0;
  }
  window.__rateCourse = rateCourse;
  function readD(){ try{ return JSON.parse(localStorage.getItem(CREDO_KEY))||{}; }catch(e){ return {}; } }
  function setRedo(done){
    var d = readD();
    if (done){ d.n = (d.n||0)+1; d.ts = Date.now(); } // 每次勾选记一次重做（取消勾选保留历史）
    d.done = done ? 1 : 0;
    try{ localStorage.setItem(CREDO_KEY, JSON.stringify(d)); }catch(e){}
    try{ localStorage.setItem('cvisit:' + CM.id, JSON.stringify({ ts: Date.now() })); }catch(e){}
    window.dispatchEvent(new CustomEvent('cstat:change'));
    renderRedoInfo();
    return d;
  }
  window.__setRedo = setRedo;
  function fmtHM(ts){
    if (!ts) return '';
    var d = new Date(ts);
    var p = function(x){ return ('0'+x).slice(-2); };
    return (d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function renderRedoInfo(){
    var el = document.getElementById('credo-info');
    if (!el) return;
    var d = readD();
    el.textContent = d.n ? ('×'+d.n+' · 上次 '+fmtHM(d.ts)) : '';
  }
  function initRedo(){
    var chk = document.getElementById('credo-chk');
    if (!chk) return;
    chk.checked = readD().done === 1;
    renderRedoInfo();
    chk.addEventListener('change', function(){
      var d = setRedo(chk.checked);
      flash(d.done ? ('✓ 已记录第 '+d.n+' 次重做') : '已取消标记（历史次数保留）');
    });
  }
  function render(){
    var s = readS();
    var el = document.getElementById('cstat-counts');
    if (el) el.textContent = '\u2705'+(s.skilled||0)+' \u00b7 \ud83d\ude10'+(s.fuzzy||0)+' \u00b7 \u274c'+(s.forgot||0);
  }
  function renderR(){
    var r = readR();
    var el = document.getElementById('crate-counts');
    if (el) el.textContent = '\ud83d\udc4d'+(r.good||0)+' \u00b7 \ud83d\udcd5'+(r.hard||0)+' \u00b7 \ud83d\udde3\ufe0f'+(r.teach||0);
  }
  function flash(msg){
    var el = document.getElementById('cstat-flash');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(flash._t);
    flash._t = setTimeout(function(){ el.classList.remove('show'); }, 1800);
  }
  function bind(id, state, label, extra){
    var btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('click', function(){
      var reset = recordCourseState(state);
      var n = readS()[state]||0;
      var msg = label+' \u00d7'+n+' \u5df2\u8bb0\u5f55' + (extra && reset ? extra : '');
      flash(msg);
    });
  }
  function bindRate(id, kind, label){
    var btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('click', function(){
      var n = rateCourse(kind);
      flash(label+' \u00d7'+n+' \u5df2\u8bb0\u5f55');
    });
  }
  function init(){
    bind('cstat-sk','skilled','\u719f\u7ec3','\uff08\u6a21\u7cca/\u5fd8\u8bb0\u5df2\u6e05\u96f6\uff09');
    bind('cstat-fz','fuzzy','\u6a21\u7cca');
    bind('cstat-fg','forgot','\u5fd8\u8bb0');
    bindRate('crate-good','good','\ud83d\udc4d \u597d');
    bindRate('crate-hard','hard','\ud83d\udcd5 \u8bfe\u4ef6\u4e0d\u597d\u61c2');
    bindRate('crate-teach','teach','\ud83d\udde3\ufe0f \u6ca1\u8001\u5e08\u8bb2\u7684\u597d');
    initRedo();
    render(); renderR();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<script>
/* ===== 课件统计上报 reporter（独立脚本，不侵入课件既有逻辑）===== */
(function(){
  'use strict';
  if (window.__cstatReporter) return;
  window.__cstatReporter = true;
  var CM = null;
  try { CM = JSON.parse(document.getElementById('c-meta').textContent); } catch(e){}
  if (!CM || !CM.id) return;
  var CID = CM.id;
  var CSTAT_KEY = 'cstat:' + CID;
  var CRATE_KEY = 'crate:' + CID;
  var CREDO_KEY = 'credo:' + CID;
  var CVISIT_KEY = 'cvisit:' + CID;
  var AUTO_KEY  = 'course_auto_sync';
  var CFG_KEY   = 'course_cloud_cfg';
  var DEFAULT_CLOUD = {
    url: 'https://mixuqjognbdrafrrlivc.supabase.co',
    key: 'sb_publishable_D0ha7g4X4LutG-3hxCguSA_pwyQLrVX'
  };
  var STATS_TABLE = 'course_stats';
  function readJSON(k, def){ try{ var v = JSON.parse(localStorage.getItem(k)); return (v==null)?def:v; }catch(e){ return def; } }
  function cloudCfg(){
    var c = readJSON(CFG_KEY, null);
    if (c && c.url && c.key && c.url.indexOf('vajgltnfpdjpnsoknoma') < 0) return c;
    return DEFAULT_CLOUD;
  }
  function autoOn(){ try{ return localStorage.getItem(AUTO_KEY) !== '0'; }catch(e){ return true; } }
  function compute(){
    var s = readJSON(CSTAT_KEY, {});
    var r = readJSON(CRATE_KEY, {});
    var d = readJSON(CREDO_KEY, {});
    return { skilled: s.skilled||0, fuzzy: s.fuzzy||0, forgot: s.forgot||0,
             rg: r.good||0, rh: r.hard||0, rt: r.teach||0,
             rd: d.done===1, rts: d.ts||0, rn: d.n||0 };
  }
  var lastLocal = '', lastCloud = '', cloudTimer = null, inFlight = false;
  function report(){
    var s = compute();
    var snap = JSON.stringify(s);
    if (snap !== lastLocal){
      lastLocal = snap;
      try{ localStorage.setItem(CSTAT_KEY, JSON.stringify({ skilled:s.skilled, fuzzy:s.fuzzy, forgot:s.forgot, ts:Date.now() })); }catch(e){}
    }
    var vt = 0;
    try{ var v = readJSON(CVISIT_KEY, null); if (v && v.ts) vt = v.ts; }catch(e){}
    if (!vt){ vt = Date.now(); try{ localStorage.setItem(CVISIT_KEY, JSON.stringify({ts:vt})); }catch(e){} }
    if (snap !== lastCloud && autoOn()){
      lastCloud = snap;
      clearTimeout(cloudTimer);
      cloudTimer = setTimeout(pushCloud, 3000);
    }
  }
  function pushCloud(){
    if (inFlight){ setTimeout(pushCloud, 1500); return; }
    inFlight = true;
    var s = compute();
    var cfg = cloudCfg();
    var vt = 0;
    try{ var v = readJSON(CVISIT_KEY, null); if (v && v.ts) vt = v.ts; }catch(e){}
    var ctl = null, timer = null;
    try { ctl = new AbortController(); } catch(e){}
    var opts = {
      method: 'POST',
      headers: {
        'apikey': cfg.key,
        'Authorization': 'Bearer ' + cfg.key,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplications,return=minimal'
      },
      body: JSON.stringify([{
        course_id: CID,
        skilled: s.skilled, fuzzy: s.fuzzy, forgot: s.forgot,
        rating_good: s.rg, rating_hard: s.rh, rating_teach: s.rt,
        redone: s.rd,
        redo_count: s.rn||0,
        redo_at: s.rts ? new Date(s.rts).toISOString() : null,
        updated_at: new Date().toISOString(),
        last_visit: vt ? new Date(vt).toISOString() : null
      }])
    };
    if (ctl){ opts.signal = ctl.signal; timer = setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, 8000); }
    fetch(cfg.url.replace(/\/+$/, '') + '/rest/v1/' + STATS_TABLE, opts)
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); })
      .catch(function(){ lastCloud = ''; })
      .then(function(){ if (timer) clearTimeout(timer); inFlight = false; });
  }
  function watch(){
    report();
    window.addEventListener('cstat:change', report);
    window.addEventListener('storage', function(e){ if (e.key === CSTAT_KEY || e.key === CRATE_KEY || e.key === CREDO_KEY) report(); });
    window.addEventListener('visibilitychange', function(){ if (!document.hidden) report(); });
    setInterval(function(){ if (!document.hidden) report(); }, 5000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch);
  else watch();
})();
</script>
<script>
/* ===== 专题练串联导航：URL 带 ?tr=<序号> 且本地有 train_group 时显示 ===== */
(function(){
  'use strict';
  if (window.__tnav) return;
  window.__tnav = true;
  var ti = NaN;
  try { ti = parseInt(new URLSearchParams(location.search).get('tr'), 10); } catch(e){ if(location.search.indexOf('tr=')>=0){ var m=location.search.match(/tr=(\d+)/); if(m)ti=parseInt(m[1],10); } }
  if (isNaN(ti) || ti < 0) return;
  var g = null;
  try { g = JSON.parse(localStorage.getItem('train_group')); } catch(e){}
  if (!g || !g.urls || !g.urls.length) return;
  var urls = g.urls;
  function toUrl(u, idx){
    var sep = u.indexOf('?') >= 0 ? '&' : '?';
    return u.replace(/^lessons\//, '../') + sep + 'tr=' + idx;
  }
  function build(){
    var bar = document.createElement('div');
    bar.id = 'tnav-bar';
    var prev = ti > 0
      ? '<a id="tnav-prev" href="' + toUrl(urls[ti-1], ti-1) + '" title="快捷键 ←">\u2190 \u4e0a\u4e00\u8bfe</a>'
      : '<span class="tnav-off">\u2190 \u4e0a\u4e00\u8bfe</span>';
    var next = ti < urls.length - 1
      ? '<a id="tnav-next" href="' + toUrl(urls[ti+1], ti+1) + '" title="快捷键 \u2192">\u4e0b\u4e00\u8bfe \u2192</a>'
      : '<span class="tnav-off">\u4e0b\u4e00\u8bfe \u2192</span>';
    bar.innerHTML = '<span id="tnav-tag">🎯 \u4e13\u9898\u7ec3</span>' + prev
      + '<span id="tnav-pos">' + (ti+1) + ' / ' + urls.length + '</span>' + next
      + '<span id="tnav-exit" title="\u9000\u51fa\u4e13\u9898\u7ec3\u4e32\u8054">✕</span>';
    document.body.appendChild(bar);
    document.getElementById('tnav-exit').addEventListener('click', function(){
      bar.remove();
      try { localStorage.removeItem('train_group'); } catch(e){}
    });
  }
  document.addEventListener('keydown', function(e){
    if (!document.getElementById('tnav-bar')) return;
    if (e.key === 'ArrowRight' && ti < urls.length - 1) location.href = toUrl(urls[ti+1], ti+1);
    else if (e.key === 'ArrowLeft' && ti > 0) location.href = toUrl(urls[ti-1], ti-1);
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
  else build();
})();
</script>
<script>
/* ===== 浮动工具栏长按拖动：自评/评价/专题练串联条，位置记忆 ===== */
(function(){
  'use strict';
  if (window.__bardrag) return;
  window.__bardrag = true;
  var IDS = ['cstat-bar', 'crate-bar', 'tnav-bar'];
  var LONG = 400, MOVE = 6;
  function key(id){ return 'bar_pos:' + id; }
  function place(el, l, t){
    var w = el.offsetWidth || 0, h = el.offsetHeight || 0;
    l = Math.min(Math.max(l, 4), window.innerWidth - w - 4);
    t = Math.min(Math.max(t, 4), window.innerHeight - h - 4);
    el.style.left = l + 'px';
    el.style.top = t + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.transform = 'none'; // 覆盖 tnav-bar 的 translateX(-50%)
  }
  function restore(el){
    try{
      var p = JSON.parse(localStorage.getItem(key(el.id)));
      if (p && typeof p.left === 'number') place(el, p.left, p.top);
    }catch(e){}
  }
  function makeDraggable(el){
    if (!el || el.__drag) return;
    el.__drag = true;
    var timer = null, sx = 0, sy = 0, ox = 0, oy = 0, dragging = false, pid = null;
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', function(e){
      if (e.button) return;
      sx = e.clientX; sy = e.clientY;
      var r = el.getBoundingClientRect(); ox = r.left; oy = r.top;
      dragging = false; pid = e.pointerId;
      clearTimeout(timer);
      timer = setTimeout(function(){
        dragging = true;
        el.classList.add('bar-dragging');
        try { el.setPointerCapture(pid); } catch(e2){}
        try { navigator.vibrate && navigator.vibrate(30); } catch(e2){}
      }, LONG);
    });
    el.addEventListener('pointermove', function(e){
      if (!dragging){
        if (Math.abs(e.clientX - sx) > MOVE || Math.abs(e.clientY - sy) > MOVE) clearTimeout(timer);
        return;
      }
      e.preventDefault();
      place(el, ox + e.clientX - sx, oy + e.clientY - sy);
    });
    function up(){
      clearTimeout(timer);
      if (dragging){
        el.classList.remove('bar-dragging');
        try{
          localStorage.setItem(key(el.id), JSON.stringify({
            left: parseFloat(el.style.left), top: parseFloat(el.style.top) }));
        }catch(e2){}
      }
      dragging = false;
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    window.addEventListener('resize', function(){ restore(el); });
  }
  function init(){
    IDS.forEach(function(id){
      var el = document.getElementById(id);
      if (el){ makeDraggable(el); restore(el); }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
