<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>组卷 / 重练器 · 组卷 / 重练器</title><style>
:root{--ink:#1f2430;--line:#e6e8ec;--mut:#6b7280;--ok:#1a8f5f;--bad:#c0392b;--warn:#b8720e;--skip:#8a93a3}
*{box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f6f7f9;color:var(--ink);line-height:1.7;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
.hero{border:1px solid var(--line);border-radius:14px;background:#fff;padding:22px 22px 18px;margin-bottom:18px}
.hero h1{font-size:22px;margin:0 0 6px}
.hero .sub{font-size:13px;color:var(--mut)}
.hero .stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.hero .stat div{font-size:13px;color:var(--mut)}.hero .stat b{font-size:18px;color:var(--ink);display:block}
.hero .lk{margin-top:12px;font-size:12.5px}
.hero .lk a{color:#0b6bd1}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.sect{font-size:17px;font-weight:700;margin:0 0 12px}
table.ov{width:100%;border-collapse:collapse;font-size:13px}
table.ov th{background:#f3f4f6;color:#374151;padding:8px 9px;text-align:left;white-space:nowrap}
table.ov td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
a{color:#0b6bd1;text-decoration:none}a:hover{text-decoration:underline}
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.qno{font-size:18px;font-weight:700}
.tag{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill{font-size:12.5px;font-weight:600;padding:2px 11px;border-radius:999px;color:#fff;white-space:nowrap}
.pill.right{background:var(--ok)}.pill.wrong{background:var(--bad)}.pill.skip{background:var(--skip)}.pill.part{background:var(--warn)}
.lab{font-size:13.5px;font-weight:700;color:#374151;margin:0 0 6px}
.stem{font-size:14.5px;background:#fafbfc;border:1px solid var(--line);border-left:3px solid #9aa4b2;border-radius:8px;padding:11px 13px;margin:8px 0;overflow-x:auto}
.tscroll{overflow-x:auto}
.stem{white-space:normal}
.shot{margin:10px 0;text-align:center}
.shot img{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
.shot figcaption{font-size:11.5px;color:var(--mut);margin-top:4px}
.ans{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin:8px 0}
.ans .stu{background:#fdecec;color:#c0392b;padding:3px 11px;border-radius:7px;font-weight:600}
.ans .corr{background:#e8f7ef;color:#1a8f5f;padding:3px 11px;border-radius:7px;font-weight:600}
.sol{font-size:13px;background:#fffdf6;border:1px solid #f0e7c8;border-left:3px solid var(--warn);border-radius:8px;padding:11px 13px;overflow-x:auto}
.hits{width:100%;border-collapse:collapse;font-size:12.5px}
.hits th{background:#f3f4f6;color:#374151;padding:7px 8px;text-align:left;white-space:nowrap}
.hits td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.7}
.hits td.cid b{color:#0b6bd1}
.score{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.score .b{width:62px;height:6px;background:#eef0f3;border-radius:99px;overflow:hidden}
.score .b i{display:block;height:100%}
.miss{background:#fff8ef;border:1px solid #f1d9b0;border-left:3px solid var(--warn);border-radius:8px;padding:10px 13px;font-size:13px;margin-top:10px}
.miss ul{margin:6px 0 0 18px}
.newcard{background:#f0fdf4;border:1px solid #bbf7d0;border-left:3px solid var(--ok);border-radius:8px;padding:10px 13px;font-size:12.5px;margin-top:8px}
.newcard b{color:#15803d}
.nc-r{display:flex;gap:8px;padding:2px 0}.nc-r .l{flex:none;width:40px;font-weight:700;color:#15803d}
iframe.ia{width:100%;height:540px;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.vbtn{margin-top:8px;font-size:12.5px;color:#0b6bd1;cursor:pointer;user-select:none}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:8px 0 30px}
.nav{font-size:13px;margin:6px 0 16px}
#lb{display:none;position:fixed;inset:0;background:rgba(15,23,42,.85);z-index:99;cursor:zoom-out;align-items:center;justify-content:center}
#lb img{max-width:96vw;max-height:96vh;border-radius:8px}
@media(max-width:640px){.hero h1{font-size:18px}.wrap{padding:12px 10px 40px}}

18沉淀·调pH除杂", "see": "看到【工业流程中调pH除去Fe³⁺等金属杂质离子】", "think": "想到【调pH使杂质完全沉淀而目标离子不沉淀】；警惕【pH过低除杂不彻底，pH过高会连带沉淀目标离子造成损失】", "src": "", "note": "", "fit": "(3)错因正是此卡警惕句：上限高了会连带沉淀Mn²⁺——上限必须<8.1而非8.3，此卡为订正核心", "score": 0.96}, {"cid": "che0019沉淀·氧化还原辅助除杂", "see": "看到【杂质离子与目标离子沉淀pH接近、需先氧化再调pH】", "think": "想到【先用氧化剂改变杂质价态（Fe²⁺→Fe³⁺），再调pH分步沉淀】；警惕【选择氧化剂要保证不引入新杂质】", "src": "", "note": "", "fit": "(2)学生漏答的「不引入新杂质」正是此卡警惕句原文", "score": 0.93}, {"cid": "che0407沉淀生成·沉淀完全判断", "see": "看到【判断某离子是否沉淀完全/求沉淀完全所需离子浓度】", "think": "想到【由pH换算c(OH⁻)代入Ksp求剩余浓度，与1.0×10⁻⁵mol/L标准比较】", "src": "", "note": "", "fit": "(5)空白题的方法卡：沉淀完全=剩余10⁻⁵，Ksp反算c(F⁻)=√(4×10⁻¹¹/10⁻⁵)=2×10⁻³", "score": 0.92}], "missing": [{"text": "未覆盖「碳酸盐沉淀法·沉M²⁺离子方程式」类通用信号（已补卡 che0540）", "card": "che0540", "subject": "化学", "chap": "碳酸盐沉淀法·沉M²⁺离子方程式", "note": "题11", "q": "（题11）高纯硫酸锰作为合成镍钴锰三元正极材料的原料，工业上由天然二氧化锰粉与硫化锰矿（还含Fe、Al、Mg、Zn、Ni、Si等元素）制备：MnSO₄·MnO₂粉→[H₂SO₄浸出]（滤渣1含S和SiO₂）→[加MnO₂氧化]→[氨水调pH]（滤渣2）→[Na₂S除杂1]（滤渣3）→[MnF₂除杂2]（滤渣4）→[NH₄HCO₃沉锰]→MnCO₃→[H₂SO₄]→MnSO₄。相关金属离子开始沉淀/沉淀完全pH：Mn²⁺ 8.1/10.1、Fe²⁺ 6.3/8.3、Fe³⁺ 1.5/2.8、Al³⁺ 3.4/4.7、Mg²⁺ 8.9/10.9、Zn²⁺ 6.2/8.2、Ni²⁺ 6.9/8.9。", "see": "看到【工业流程用NaHCO₃/NH₄HCO₃沉出金属碳酸盐（沉锰/沉钴/沉镍）且有气泡冒出】", "think": "想到【二价金属离子+碳酸氢盐：Mn²⁺+2HCO₃⁻=MnCO₃↓+CO₂↑+H₂O——HCO₃⁻既提供CO₃²⁻又放出CO₂；气泡=CO₂是流程判断依据】；警惕【试剂是HCO₃⁻就别写成M²⁺+CO₃²⁻形式；别漏CO₂↑和H₂O；三价金属（Fe³⁺）与HCO₃⁻则互促水解完全】"}], "interactive": "interactives/q11.html", "is_wrong": true, "imgs_uri": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAMBAyADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBA function lb(e){var m=document.getElementById('lb');document.getElementById('lbi').src=e.src;m.style.display='flex';}
function vpill(v){return {right:'<span class="pill right">✔ 正确</span>',wrong:'<span class="pill wrong">✘ 答错</span>',skip:'<span class="pill skip">⚪ 未作答</span>',part:'<span class="pill part">◐ 部分/未完成</span>'}[v]||'';}
function scoreBar(s){var pct=Math.round(s*100);var c=s>=0.9?'#1a8f5f':(s>=0.8?'#b8720e':'#c0392b');return '<span class="score"><span>'+s.toFixed(2)+'</span><span class="b"><i style="width:'+pct+'%;background:'+c+'"></i></span><span>/1</span></span>';}
function hitsTbl(h){if(!h.length)return '';var r='';h.forEach(function(x){r+='<tr><td class="cid"><b>'+x.cid+'</b></td><td>'+(x.see||'')+'</td><td>'+(x.think||'')+'</td><td>'+(x.src||'')+'</td><td>'+(x.note||'—')+'</td><td>'+(x.fit||'')+'</td><td>'+scoreBar(x.score)+'</td></tr>';});return '<div class="tscroll"><table class="hits"><thead><tr><th>编号</th><th>看到</th><th>想到</th><th>出处</th><th>备注</th><th>契合分析</th><th>评分</th></tr></thead><tbody>'+r+'</tbody></table></div>';}
function missBox(m){if(!m.length)return '';var o='<div class="miss"><b>⚠ 缺失信号（已补卡）</b><ul>';m.forEach(function(x){o+='<li>'+x.text+'</li>';});o+='</ul></div>';return o;}
function qBlock(d,reveal){var imgs='';d.imgs_uri.forEach(function(u){if(u)imgs+='<figure><img src="'+u+'" onclick="lb(this)" style="max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in"><figcaption>📎 点击放大</figcaption></figure>';});
var ans=reveal?'<div class="ans"><span class="stu">学生：'+(d.stu||'')+'</span><span class="corr">参考答案：'+(d.correct||'')+'</span></div>':'';
var sol=reveal?'<div class="sol">'+(d.analysis||'')+'</div>':'';
var btn=reveal?'':'<div class="vbtn" onclick="this.parentNode.querySelector(\'.sol\').style.display=\'block\';this.parentNode.querySelector(\'.ans\').style.display=\'flex\';this.style.display=\'none\'">显示答案 ▾</div>';
return '<section class="qcard"><div class="qh"><span class="qno">第 '+d.no+' 题</span><span class="tag">'+(d.src||'')+'</span><span class="tag">满分 '+(d.score||'')+' 分</span>'+vpill(d.verdict)+'</div>'
+'<div class="lab">题干</div><div class="stem">'+d.stem+'</div>'
+'<div class="lab">原题截图</div><div class="shot">'+imgs+'</div>'+ans+sol+btn
+'<div class="lab">🎯 命中记忆卡（'+(d.hits||[]).length+' 张）</div>'+hitsTbl(d.hits||[])+missBox(d.missing||[])+'</section>';}
function selAll(v){document.querySelectorAll('#picker input').forEach(function(c){c.checked=v;});}
function gen(){var mode=document.getElementById('mode').checked;var paper=document.getElementById('paper');paper.innerHTML='';
document.querySelectorAll('#picker input:checked').forEach(function(c){var d=Q[+c.value];var rev=!mode;var sec=document.createElement('div');sec.innerHTML=qBlock(d,rev);paper.appendChild(sec);});
if(!paper.children.length)paper.innerHTML='<div class="card">未选题</div>';}
(function(){var pk=document.getElementById('picker');Q.forEach(function(d,i){var l=document.createElement('label');l.style.cssText='font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer';l.innerHTML='<input type="checkbox" value="'+i+'" checked> 第'+d.no+'题';pk.appendChild(l);});})();
</script></body></html>
