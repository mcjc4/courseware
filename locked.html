<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 加锁课件库 · 昕言解题课件库</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
    background:
      radial-gradient(900px 420px at 8% -4%, rgba(91,124,250,.10), transparent 60%),
      radial-gradient(760px 380px at 96% -6%, rgba(45,208,180,.12), transparent 60%),
      linear-gradient(160deg,#eef6ff,#f2fdf7);
    background-attachment:fixed; color:#1f2d3d; min-height:100vh; padding:28px 18px 60px;
  }
  .wrap { max-width:560px; margin:0 auto; }
  .hero {
    background:linear-gradient(120deg,#5b7cfa,#4f8ef7 45%,#2fd0b4,#57d98d);
    border-radius:22px; padding:40px 36px 36px; color:#fff;
    box-shadow:0 18px 44px -18px rgba(47,120,240,.55);
  }
  .hero .tag {
    display:inline-block; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.35);
    font-size:13px; padding:4px 12px; border-radius:999px; margin-bottom:16px; letter-spacing:1px;
  }
  .hero h1 { font-size:28px; font-weight:700; letter-spacing:1px; }
  .hero p { margin-top:12px; font-size:14px; opacity:.95; line-height:1.7; }
  .lockCard {
    background:#fff; border-radius:18px; margin-top:18px; padding:28px 30px;
    box-shadow:0 12px 32px -14px rgba(31,45,61,.22); border:1px solid #e6eef7;
  }
  .lockCard label { display:block; font-size:14px; font-weight:600; color:#374151; margin-bottom:8px; }
  .lockRow { display:flex; gap:10px; }
  .lockRow input {
    flex:1; padding:12px 14px; border:1px solid #d1d5db; border-radius:12px; font-size:15px;
    letter-spacing:2px; outline:none; transition:border-color .15s;
  }
  .lockRow input:focus { border-color:#4f8ef7; box-shadow:0 0 0 3px rgba(79,142,247,.14); }
  .lockRow button {
    padding:12px 22px; border:none; border-radius:12px; cursor:pointer; font-size:15px; font-weight:600; color:#fff;
    background:linear-gradient(120deg,#4f8ef7,#2fd0b4); box-shadow:0 8px 20px -8px rgba(47,142,247,.5);
  }
  .lockRow button:active { transform:translateY(1px); }
  .lockErr { min-height:20px; margin-top:10px; font-size:13px; color:#dc2626; }
  .lockErr.shake { animation:shk .4s; }
  @keyframes shk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .lockHint { margin-top:16px; font-size:12px; color:#6b7280; line-height:1.8; }
  .lockHint code { background:#f1f5f9; border-radius:4px; padding:1px 6px; font-size:12px; color:#0C447C; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="tag">🔒 加锁课件库</span>
    <h1>昕言解题课件库</h1>
    <p>课件库已加锁：输入密码解锁后即可浏览全部互动课件（解锁状态当天有效，关闭浏览器后重新锁定）。</p>
  </div>
  <div class="lockCard">
    <label for="pwd">解锁密码</label>
    <div class="lockRow">
      <input id="pwd" type="password" placeholder="请输入密码" autocomplete="current-password">
      <button id="unlockBtn" type="button">🔓 解锁</button>
    </div>
    <div class="lockErr" id="lockErr"></div>
    <div class="lockHint">
      默认密码 <code>xy2026</code>（改密码：用文本编辑器打开本文件，搜 <code>LOCK_PWD</code> 改掉即可）。<br>
      已解锁状态下，课件库首页右上角有「🔓 退出锁定」可立即重新上锁。
    </div>
  </div>
</div>
<script>
/* LOCK-VER: 20261018a —— 加锁课件库密码门（家长向：先解锁才能看课件）
   默认密码在下方 LOCK_PWD，可自行修改；解锁标记按天存 localStorage（cw_unlock）。 */
(function(){
  var LOCK_PWD = 'xy2026';
  try{ if(localStorage.getItem('cw_unlock') === new Date().toDateString()){ location.replace('index.html'); } }catch(e){}
  var inp = document.getElementById('pwd'), err = document.getElementById('lockErr');
  function unlock(){
    var v = (inp.value || '').trim();
    if(!v){ err.textContent = '请输入密码'; err.classList.remove('shake'); void err.offsetWidth; err.classList.add('shake'); inp.focus(); return; }
    if(v !== LOCK_PWD){
      err.textContent = '密码不正确，请重试';
      err.classList.remove('shake'); void err.offsetWidth; err.classList.add('shake');
      inp.value = ''; inp.focus(); return;
    }
    try{ localStorage.setItem('cw_unlock', new Date().toDateString()); }catch(e){}
    location.replace('index.html');
  }
  document.getElementById('unlockBtn').addEventListener('click', unlock);
  inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') unlock(); });
  inp.focus();
})();
</script>
</body>
</html>
